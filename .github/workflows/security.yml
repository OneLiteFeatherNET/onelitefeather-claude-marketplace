name: Security

# Trivy vulnerability gate plus a CycloneDX SBOM of the repository. Self-contained
# on purpose: it needs no build tool and no registry credentials, so it is the
# baseline security gate for every repository regardless of language.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "13 3 * * 1"
  workflow_dispatch:
# No permissions by default; each job asks for what it needs.
permissions: {}

jobs:
  trivy:
    name: Trivy scan
    permissions:
      contents: read
      security-events: write # upload the SARIF report to code scanning
    uses: OneLiteFeatherNET/workflows/.github/workflows/security-scan.yml@v2.8.1
    with:
      scan-type: "fs"
      scanners: "vuln,secret"
      severity: "CRITICAL,HIGH"
      # Report-only for now, so adopting this does not turn CI red on day one.
      fail-on-findings: false
      upload-sarif: true

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: bom.json
          # An SBOM is an inventory, not a finding list - never fail on it.
          exit-code: '0'

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: bom.json
          if-no-files-found: error
          retention-days: 90

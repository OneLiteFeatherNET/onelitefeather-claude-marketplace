name: release-please

# release-please collects Conventional Commits into a release PR; merging it tags
# the version and cuts the GitHub release.
#
# Each plugin under plugins/ is its own release-please package, so a commit is
# attributed to a plugin by the files it touches, not by its commit scope, and a
# release PR bumps only the plugins that actually changed. Merging it tags each of
# them (e.g. diataxis-docs-v0.2.0) and cuts one GitHub release per tag.
#
# Anything a release needs must be chained into this same run: release-please tags
# with GITHUB_TOKEN, and a tag pushed that way does NOT start a separate
# `on: push: tags` workflow. Gate such a job on the `releases_created` output --
# NOT on `release_created`, which the action only sets for a root package. This
# manifest has no root package, so `release_created` is never true here.

on:
  push:
    branches: [main]
  workflow_dispatch:

# No permissions by default, so any job added later starts with none and has to
# ask for what it needs explicitly. The reusable workflow declares its own.
permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    uses: OneLiteFeatherNET/workflows/.github/workflows/release-please.yml@v2.8.1
    permissions:
      contents: write      # create tags and GitHub releases
      pull-requests: write # open and update the release PR
    secrets: inherit
